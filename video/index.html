<!doctype html>
<html lang="ms" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Anton"; src: url("assets/fonts/anton.woff2") format("woff2"); font-weight: 400; }
      @font-face { font-family: "Montserrat"; src: url("assets/fonts/montserrat-700.woff2") format("woff2"); font-weight: 700; }
      @font-face { font-family: "Montserrat"; src: url("assets/fonts/montserrat-800.woff2") format("woff2"); font-weight: 800; }
      @font-face { font-family: "Montserrat"; src: url("assets/fonts/montserrat-900.woff2") format("woff2"); font-weight: 900; }

      :root {
        /* Title / label sizes are written at first-version size and multiplied by --k (= 70%).
           Captions are a fixed 60 px. */
        --k: 0.7;
        --yellow: #ffe600;
        --neon: #39ff14;
        --red: #ff2d3a;
        --title: "Anton", sans-serif;
        --label: "Montserrat", sans-serif;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #000; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #000; }

      /* ---------- footage ---------- */
      .shot { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; object-fit: cover; transform-origin: 50% 50%; }
      #shade { position: absolute; inset: 0; z-index: 5;
        background: linear-gradient(180deg, rgba(0,0,0,.5) 0%, rgba(0,0,0,.25) 28%, rgba(0,0,0,0) 42%, rgba(0,0,0,0) 56%, rgba(0,0,0,.35) 68%, rgba(0,0,0,0) 80%); }
      #painTint { position: absolute; inset: 0; z-index: 6; opacity: 0;
        background: radial-gradient(ellipse at 50% 60%, rgba(255,0,0,0) 35%, rgba(190,0,20,.6) 100%); }
      #flash { position: absolute; inset: 0; background: #fff; opacity: 0; z-index: 90; }

      /* ---------- graphic primitives ---------- */
      .g { position: absolute; opacity: 0; visibility: hidden; z-index: 20; }
      .band { left: 192px; width: 696px; text-align: center; } /* centred on 540, inside the 120–888 safe column */
      .title { font-family: var(--title); text-transform: uppercase; line-height: 1.04; text-align: center;
        -webkit-text-stroke: calc(16px * var(--k)) #000; paint-order: stroke fill; }
      .chip { font-family: var(--label); font-weight: 800; text-transform: uppercase; color: #000;
        font-size: calc(48px * var(--k)); padding: calc(16px * var(--k)) calc(34px * var(--k));
        border-radius: 999px; background: var(--neon); box-shadow: 0 8px 0 rgba(0,0,0,.55); white-space: nowrap; }
      .check { display: flex; align-items: center; gap: 16px; background: rgba(0,0,0,.8); border: 4px solid var(--neon);
        border-radius: 22px; padding: 12px 26px 12px 14px; font-family: var(--label); font-weight: 900; text-transform: uppercase;
        color: #fff; font-size: calc(54px * var(--k)); white-space: nowrap; }
      .check svg { width: 44px; height: 44px; flex: none; }

      /* 1 hook */
      #hookA { top: 306px; font-size: calc(100px * var(--k)); color: #fff; }
      #hookB { top: 370px; font-size: calc(200px * var(--k)); color: var(--red); }
      #hookC { top: 512px; font-size: calc(200px * var(--k)); color: var(--red); }
      #hookD { top: 656px; font-size: calc(120px * var(--k)); color: var(--yellow); }
      /* pulsing ring on the bruised toenail (B-roll c01) */
      #nailRing { left: 290px; top: 730px; width: 540px; height: 540px; border-radius: 50%; border: 12px solid var(--red);
        box-shadow: 0 0 30px rgba(255,45,58,.8), inset 0 0 24px rgba(255,45,58,.5); }
      #nailPulse { left: 290px; top: 730px; width: 540px; height: 540px; border-radius: 50%; border: 8px solid var(--red); }

      /* 2 sports */
      #chips { left: 120px; top: 300px; display: flex; flex-direction: column; gap: 20px; align-items: flex-start; }
      #chips .chip { opacity: 0; visibility: hidden; }

      /* 3 friction */
      #friction { left: 240px; top: 900px; width: 520px; height: 204px; }

      /* 4 pain */
      #pedih { top: 380px; font-size: calc(170px * var(--k)); color: #fff; }
      #pedih span { color: var(--red); }

      /* 5 product */
      #prodA { top: 306px; font-size: calc(100px * var(--k)); color: #fff; }
      #prodB { top: 372px; font-size: calc(180px * var(--k)); color: var(--neon); }

      /* 6 grip + touch */
      #gripTag { left: 0; width: 1080px; top: 310px; text-align: center; }
      #gripTag .chip { display: inline-block; }
      #gripLine { left: 536px; top: 372px; width: 8px; height: 220px; background: var(--neon); transform-origin: 50% 0; }
      #gripRing { left: 330px; top: 590px; width: 420px; height: 420px; border-radius: 50%; border: 8px solid var(--neon);
        box-shadow: 0 0 30px rgba(57,255,20,.7), inset 0 0 30px rgba(57,255,20,.4); }
      #chkKesat { left: 192px; width: 696px; top: 320px; display: flex; justify-content: center; }
      #chkTimbul { left: 192px; width: 696px; top: 420px; display: flex; justify-content: center; }

      /* 7 risk meter */
      #meter { left: 170px; top: 300px; width: 700px; }
      #meter .mt { font-family: var(--label); font-weight: 900; color: #fff; font-size: calc(50px * var(--k)); text-align: center;
        -webkit-text-stroke: 6px #000; paint-order: stroke fill; margin-bottom: 14px; letter-spacing: 2px; }
      #meter .track { position: relative; height: 54px; border-radius: 30px; background: rgba(0,0,0,.72); border: 4px solid #fff; overflow: hidden; }
      #meter .fill { position: absolute; left: 0; top: 0; bottom: 0; width: 92%; background: var(--red); border-radius: 30px; }
      #meter .ends { display: flex; justify-content: space-between; margin-top: 10px; font-family: var(--label); font-weight: 900;
        font-size: calc(44px * var(--k)); color: #fff; -webkit-text-stroke: 5px #000; paint-order: stroke fill; }

      /* 8 breathable */
      #breath { top: 296px; }
      #breath .pre { display: block; font-family: var(--title); color: #fff; font-size: calc(90px * var(--k));
        -webkit-text-stroke: 10px #000; paint-order: stroke fill; margin-bottom: 6px; }
      #breath .pill { display: inline-block; background: var(--neon); color: #000; font-family: var(--title); text-transform: uppercase;
        font-size: calc(130px * var(--k)); padding: 4px 36px 0; border-radius: 26px; box-shadow: 0 10px 0 rgba(0,0,0,.55); }
      #air { left: 120px; top: 600px; width: 380px; height: 260px; }
      #chkPanas { left: 120px; top: 900px; }
      #chkKuap { left: 120px; top: 1010px; }

      /* 9–10 CTA */
      #ctaA { top: 306px; font-size: calc(100px * var(--k)); color: #fff; }
      #ctaB { top: 374px; font-size: calc(200px * var(--k)); color: var(--neon); }
      #dots { left: 192px; width: 696px; top: 548px; display: flex; justify-content: center; gap: 26px; }
      #dots i { display: block; width: 58px; height: 58px; border-radius: 50%; border: 6px solid #fff; box-shadow: 0 6px 0 rgba(0,0,0,.5); opacity: 0; }
      #btn { left: 150px; top: 880px; width: 630px; height: 150px; border-radius: 80px; background: var(--yellow);
        display: flex; align-items: center; justify-content: center; box-shadow: 0 12px 0 #b39d00, 0 20px 40px rgba(0,0,0,.6); }
      #btn span { font-family: var(--title); font-size: calc(150px * var(--k)); color: #000; text-transform: uppercase; letter-spacing: 1px; }
      #ripple { left: 150px; top: 880px; width: 630px; height: 150px; border-radius: 80px; border: 8px solid var(--yellow); z-index: 19; }
      #soldout { left: 120px; width: 660px; top: 1066px; font-size: calc(110px * var(--k)); color: #fff; }
      #soldout b { color: var(--red); font-weight: 400; }

      /* ---------- captions: 60 px Anton, caps, black stroke, bottom edge at y 1248 ---------- */
      #cap { position: absolute; left: 0; width: 1080px; bottom: 690px; height: 80px; z-index: 40; overflow: visible; }
      .cg { position: absolute; left: 0; right: 0; bottom: 0; text-align: center; opacity: 0; visibility: hidden; white-space: nowrap; }
      .cw { display: inline-block; margin: 0 15px; font-family: var(--title); font-size: 60px; line-height: 1.15; text-transform: uppercase;
        color: #fff; -webkit-text-stroke: 10px #000; paint-order: stroke fill; transform-origin: 50% 80%; }
      .cw.kw { color: var(--neon); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="31.4" data-width="1080" data-height="1920" data-fps="60">

      <!-- ===== voiceover: original file, unity gain, untouched, starts at 0 ===== -->
      <audio id="vo" class="clip" src="assets/vo.wav" data-start="0" data-duration="29.766" data-volume="1" data-track-index="20"></audio>

      <!-- ===== footage: 10 single-shot clips at 1x; each levelled to -57 LUFS with data-volume (cap +12 dB) ===== -->
      <video id="c01" class="clip shot" src="assets/clips/c01.mp4" data-start="0"     data-duration="3.55" data-media-start="0" data-volume="0.03199" data-has-audio="true" data-track-index="1" playsinline></video><!-- B-roll toe: -27.1 LUFS → -29.9 dB -->
      <video id="c02" class="clip shot" src="assets/clips/c02.mp4" data-start="3.55"  data-duration="2.65" data-media-start="0" data-volume="0.02455" data-has-audio="true" data-track-index="1" playsinline></video><!-- -24.8 LUFS → -32.2 dB -->
      <video id="c03" class="clip shot" src="assets/clips/c03.mp4" data-start="6.2"   data-duration="3.25" data-media-start="0" data-volume="0.02754" data-has-audio="true" data-track-index="1" playsinline></video><!-- -25.8 LUFS → -31.2 dB -->
      <video id="c04" class="clip shot" src="assets/clips/c04.mp4" data-start="9.45"  data-duration="3.25" data-media-start="0" data-volume="0.13804" data-has-audio="true" data-track-index="1" playsinline></video><!-- B-roll leg pain: -39.8 LUFS → -17.2 dB -->
      <video id="c05" class="clip shot" src="assets/clips/c05.mp4" data-start="12.7"  data-duration="3.2"  data-media-start="0" data-volume="2.23872" data-has-audio="true" data-track-index="1" playsinline></video><!-- -64.0 LUFS → +7.0 dB -->
      <video id="c06" class="clip shot" src="assets/clips/c06.mp4" data-start="15.9"  data-duration="4.2"  data-media-start="0" data-volume="0.1135"  data-has-audio="true" data-track-index="1" playsinline></video><!-- -38.1 LUFS → -18.9 dB -->
      <video id="c07" class="clip shot" src="assets/clips/c07.mp4" data-start="20.1"  data-duration="2.52" data-media-start="0" data-volume="0.02541" data-has-audio="true" data-track-index="1" playsinline></video><!-- -25.1 LUFS → -31.9 dB -->
      <video id="c08" class="clip shot" src="assets/clips/c08.mp4" data-start="22.62" data-duration="3.23" data-media-start="0" data-volume="0.01738" data-has-audio="true" data-track-index="1" playsinline></video><!-- -21.8 LUFS → -35.2 dB -->
      <video id="c09" class="clip shot" src="assets/clips/c09.mp4" data-start="25.85" data-duration="2.29" data-media-start="0" data-volume="1.01158" data-has-audio="true" data-track-index="1" playsinline></video><!-- -57.1 LUFS → +0.1 dB -->
      <video id="c10" class="clip shot" src="assets/clips/c10.mp4" data-start="28.14" data-duration="3.26" data-media-start="0" data-volume="0.66069" data-has-audio="true" data-track-index="1" playsinline></video><!-- -53.4 LUFS → -3.6 dB -->

      <div id="shade"></div>
      <div id="painTint"></div>

      <!-- 1 · hook -->
      <div id="hookA" class="g title band">Tak nak jadi</div>
      <div id="hookB" class="g title band">Melecit</div>
      <div id="hookC" class="g title band">&amp; Lebam</div>
      <div id="hookD" class="g title band">Macam ni?</div>
      <div id="nailRing" class="g"></div>
      <div id="nailPulse" class="g"></div>

      <!-- 2 · active sports -->
      <div id="chips" class="g">
        <div class="chip" id="chip1">Pickleball</div>
        <div class="chip" id="chip2">Futsal</div>
        <div class="chip" id="chip3">Larian</div>
      </div>

      <!-- 3 · friction -->
      <svg id="friction" class="g" viewBox="0 0 520 204">
        <path id="arrL" d="M20 64 L100 14 L100 44 L240 44 L240 84 L100 84 L100 114 Z" fill="#ff2d3a" stroke="#000" stroke-width="6" stroke-linejoin="round" />
        <path id="arrR" d="M500 140 L420 90 L420 120 L280 120 L280 160 L420 160 L420 190 Z" fill="#ffe600" stroke="#000" stroke-width="6" stroke-linejoin="round" />
      </svg>

      <!-- 4 · pain -->
      <div id="pedih" class="g title band">Memang<br /><span>pedih gila</span><br />kan?</div>

      <!-- 5 · product -->
      <div id="prodA" class="g title band">Tukar kepada</div>
      <div id="prodB" class="g title band">Stokin<br />Anti-Slip</div>

      <!-- 6 · grip + touch -->
      <div id="gripTag" class="g"><span class="chip">Grip anti-slip</span></div>
      <div id="gripLine" class="g"></div>
      <div id="gripRing" class="g"></div>
      <div id="chkKesat" class="g"><div class="check"><svg viewBox="0 0 60 60"><circle cx="30" cy="30" r="28" fill="#39ff14" /><path d="M16 31 L26 41 L45 20" fill="none" stroke="#000" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" /></svg>Rasa kesat</div></div>
      <div id="chkTimbul" class="g"><div class="check"><svg viewBox="0 0 60 60"><circle cx="30" cy="30" r="28" fill="#39ff14" /><path d="M16 31 L26 41 L45 20" fill="none" stroke="#000" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" /></svg>Dan timbul</div></div>

      <!-- 7 · blister-risk meter -->
      <div id="meter" class="g">
        <div class="mt">RISIKO MELECIT</div>
        <div class="track"><div class="fill" id="meterFill"></div></div>
        <div class="ends"><span>RENDAH</span><span>TINGGI</span></div>
      </div>

      <!-- 8 · breathable -->
      <div id="breath" class="g band"><span class="pre">KAIN</span><span class="pill">Breathable</span></div>
      <svg id="air" class="g" viewBox="0 0 380 260" fill="none" stroke="#ffffff" stroke-width="12" stroke-linecap="round">
        <path class="aw" d="M20 50 C 90 10 150 90 220 50 S 330 10 360 50" />
        <path class="aw" d="M20 130 C 90 90 150 170 220 130 S 330 90 360 130" />
        <path class="aw" d="M20 210 C 90 170 150 250 220 210 S 330 170 360 210" />
      </svg>
      <div id="chkPanas" class="g check"><svg viewBox="0 0 60 60"><circle cx="30" cy="30" r="28" fill="#39ff14" /><path d="M16 31 L26 41 L45 20" fill="none" stroke="#000" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" /></svg>Tak rasa panas</div>
      <div id="chkKuap" class="g check"><svg viewBox="0 0 60 60"><circle cx="30" cy="30" r="28" fill="#39ff14" /><path d="M16 31 L26 41 L45 20" fill="none" stroke="#000" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" /></svg>Tak rasa berkuap</div>

      <!-- 9–10 · CTA -->
      <div id="ctaA" class="g title band">Warna dah banyak</div>
      <div id="ctaB" class="g title band">Restock!</div>
      <div id="dots" class="g"><i style="background:#e10f2a"></i><i style="background:#0f8a3c"></i><i style="background:#111"></i></div>
      <div id="btn" class="g"><span>Grab cepat</span></div>
      <div id="ripple" class="g"></div>
      <div id="soldout" class="g title">Sebelum <b>sold out!</b></div>

      <div id="cap"></div>
      <div id="flash"></div>
      <div id="sfx"></div>
    </div>

    <script>
      // ------------------------------------------------------------------ data
      const DUR = 31.4;
      const CLIPS = [
        ["c01", 0, 3.55], ["c02", 3.55, 6.2], ["c03", 6.2, 9.45], ["c04", 9.45, 12.7], ["c05", 12.7, 15.9],
        ["c06", 15.9, 20.1], ["c07", 20.1, 22.62], ["c08", 22.62, 25.85], ["c09", 25.85, 28.14], ["c10", 28.14, DUR],
      ];
      const CUTS = CLIPS.slice(1).map((c) => c[1]);

      // Self-synthesised SFX (tools/synth_sfx.py), each ~-40 LUFS = ~10 dB under the -30 LUFS voiceover.
      // Whooshes are pre-rolled 0.27 s so their swell lands on the cut.
      const SFX = [
        ["zap", 0.0], ["impact", 0.42], ["pop", 1.02],
        ["pop", 4.58], ["pop", 4.82], ["pop", 5.06],
        ["zap", 7.32],
        ["impact", 11.62], ["riser", 12.12], ["impact", 13.72], ["ding", 14.8],
        ["pop", 16.86], ["pop", 19.04], ["ding", 19.68],
        ["zap", 21.08], ["ding", 22.92], ["pop", 25.34], ["pop", 26.16],
        ["cha-ching", 27.66], ["pop", 28.62], ["impact", 29.14],
        ...CUTS.map((c) => ["whoosh", +(c - 0.27).toFixed(2)]),
      ];
      const SFX_LEN = { whoosh: 0.55, pop: 0.12, ding: 1.4, impact: 0.9, "cha-ching": 1.3, riser: 1.6, zap: 0.32 };

      // Caption groups (2–3 words) from the word-level transcript. Clauses an on-screen graphic already spells
      // out are deliberately absent: "tak nak jadi melecit lebam macam ni", "memang pedih gila kan",
      // "korang tukar kepada stokin anti-slip macam ni", "akan rasa kesat dan timbul", "dan kain pun breathable
      // sangat", "tak rasa panas", "tak rasa berkuap tau", "warna dah banyak restock", "korang grab cepat sebelum sold out".
      const K = 1;
      const CAPS = [
        [["korang", 1.58, 2.16], ["tukar", 2.16, 2.44, K]],
        [["stokin", 2.44, 2.74], ["yang", 2.74, 2.84], ["korang", 2.84, 3.04]],
        [["pakai", 3.04, 3.26], ["tu.", 3.26, 3.46]],
        [["especially", 3.6, 4.0], ["yang", 4.0, 4.58]],
        [["aktif", 4.58, 4.82, K], ["bersukan,", 4.82, 5.2, K]],
        [["yang", 5.34, 5.56], ["banyak", 5.56, 5.74], ["bergerak.", 5.74, 6.1, K]],
        [["tapak", 6.3, 6.7], ["kaki", 6.7, 7.0], ["akan", 7.0, 7.08]],
        [["banyak", 7.08, 7.32], ["bergesel", 7.32, 7.88, K]],
        [["dalam", 7.88, 8.06], ["kasut", 8.06, 8.42]],
        [["setiap", 8.42, 8.58], ["kali", 8.58, 8.72], ["korang", 8.72, 8.88]],
        [["bergerak", 8.88, 9.16], ["tau.", 9.16, 9.3]],
        [["lama-lama,", 9.54, 10.2], ["jadi", 10.28, 10.56], ["korang", 10.56, 10.9]],
        [["boleh", 10.9, 11.02], ["melecit", 11.02, 11.28, K], ["teruk.", 11.28, 11.5, K]],
        [["so", 12.76, 13.0], ["lepas", 13.0, 13.26], ["ni,", 13.26, 13.46]],
        [["dekat", 16.04, 16.44], ["tapak", 16.44, 16.8], ["ni", 16.8, 16.86]],
        [["ada", 16.86, 17.04], ["grip", 17.04, 17.3, K], ["dot", 17.3, 17.62, K]],
        [["bila", 17.8, 18.2], ["korang", 18.2, 18.4], ["sentuh,", 18.4, 18.78]],
        [["so", 20.16, 20.56], ["geselan", 20.56, 20.92, K], ["pun", 20.92, 21.08]],
        [["berkurang", 21.08, 21.58, K], ["bila", 21.58, 21.78], ["korang", 21.78, 21.98]],
        [["aktif", 21.98, 22.22, K], ["bergerak.", 22.22, 22.6, K]],
        [["korang", 24.1, 24.5], ["pakai", 24.5, 24.62]],
        [["lama", 24.62, 24.82], ["pun", 24.82, 25.04]],
      ];

      // ------------------------------------------------------------------ DOM
      const sfxHost = document.getElementById("sfx");
      SFX.forEach(([name, at], i) => {
        const a = document.createElement("audio");
        a.id = "sfx" + i;
        a.className = "clip";
        a.src = "assets/sfx/" + name + ".wav";
        a.dataset.start = String(Math.max(0, at));
        a.dataset.duration = String(SFX_LEN[name]);
        a.dataset.volume = "1";
        a.dataset.trackIndex = "30";
        sfxHost.appendChild(a);
      });

      const capHost = document.getElementById("cap");
      const capGroups = CAPS.map((words, gi) => {
        const g = document.createElement("div");
        g.className = "cg";
        g.id = "cg" + gi;
        const spans = words.map(([w, s, e, kw]) => {
          const sp = document.createElement("span");
          sp.className = "cw" + (kw ? " kw" : "");
          sp.textContent = w.toUpperCase();
          g.appendChild(sp);
          return { el: sp, s, e, kw: !!kw };
        });
        capHost.appendChild(g);
        return { el: g, words: spans, s: words[0][1], e: words[words.length - 1][2] };
      });

      // ------------------------------------------------------------------ timeline
      const tl = gsap.timeline({ paused: true });
      const show = (el, at) => tl.set(el, { autoAlpha: 1 }, at);
      const hide = (el, at) => tl.set(el, { autoAlpha: 0 }, at);
      const popIn = (el, at, from = {}) => {
        tl.set(el, { autoAlpha: 1 }, at);
        tl.fromTo(el, { scale: 0.35, ...from }, { scale: 1, x: 0, y: 0, rotation: 0, duration: 0.42, ease: "back.out(2.6)" }, at);
      };
      const dropIn = (el, at) => {
        tl.set(el, { autoAlpha: 1 }, at);
        tl.fromTo(el, { y: -50, opacity: 0 }, { y: 0, opacity: 1, duration: 0.25, ease: "power3.out" }, at);
      };
      const slam = (el, at) => {
        tl.set(el, { autoAlpha: 1 }, at);
        tl.fromTo(el, { scale: 2.4, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.22, ease: "power4.in" }, at);
      };
      const out = (el, at, d = 0.2) => {
        tl.to(el, { opacity: 0, y: -36, duration: d, ease: "power2.in" }, at);
        tl.set(el, { autoAlpha: 0 }, at + d);
      };
      const shake = (els, at, amp = 16) =>
        tl.to(els, { keyframes: { x: [0, -amp, amp * 0.8, -amp * 0.6, amp * 0.4, 0], y: [0, amp * 0.5, -amp * 0.4, amp * 0.3, 0, 0] }, duration: 0.32, ease: "none" }, at);

      // Footage: brief zoom-in punch at the head of every clip, then a slow drift; white flash on each cut.
      CLIPS.forEach(([id, a, b]) => {
        tl.fromTo("#" + id, { scale: 1.0 }, { scale: 1.08, duration: 0.45, ease: "expo.out" }, a);
        tl.to("#" + id, { scale: 1.11, duration: b - a - 0.45, ease: "none" }, a + 0.45);
      });
      tl.set("#c01", { transformOrigin: "560px 1000px" }, 0); // punch in toward the bruised toenail
      tl.set("#c04", { transformOrigin: "640px 1150px" }, 0); // punch in toward the hand on the shin
      tl.set("#flash", { opacity: 0 }, 0);
      CUTS.forEach((c) => tl.fromTo("#flash", { opacity: 0.9 }, { opacity: 0, duration: 0.2, ease: "power2.out", immediateRender: false }, c));

      // 1 · HOOK (0 – 3.55): first frame already carries the hook line (thumbnail)
      show("#hookA", 0);
      slam("#hookB", 0.42);
      slam("#hookC", 0.76);
      shake(["#c01", "#hookB", "#hookC"], 0.98, 14);
      popIn("#hookD", 1.02, { rotation: -6 });
      tl.set("#nailRing", { autoAlpha: 1 }, 0.76);
      tl.fromTo("#nailRing", { scale: 1.8, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.3, ease: "back.out(1.8)" }, 0.76);
      tl.to("#nailRing", { scale: 1.05, duration: 0.3, repeat: 7, yoyo: true, ease: "sine.inOut" }, 1.1);
      tl.set("#nailPulse", { autoAlpha: 1 }, 1.1);
      tl.fromTo("#nailPulse", { scale: 1, opacity: 0.9 }, { scale: 1.35, opacity: 0, duration: 0.6, repeat: 3, ease: "power1.out", immediateRender: false }, 1.1);
      ["#hookA", "#hookB", "#hookC", "#hookD", "#nailRing", "#nailPulse"].forEach((s) => out(s, 3.3));

      // 2 · ACTIVE (3.55 – 6.2)
      show("#chips", 3.55);
      [["#chip1", 4.58], ["#chip2", 4.82], ["#chip3", 5.06]].forEach(([s, t]) => popIn(s, t, { x: -160 }));
      out("#chips", 5.98);

      // 3 · FRICTION (6.2 – 9.45)
      popIn("#friction", 7.32);
      tl.to("#arrL", { x: 36, duration: 0.12, repeat: 13, yoyo: true, ease: "sine.inOut" }, 7.6);
      tl.to("#arrR", { x: -36, duration: 0.12, repeat: 13, yoyo: true, ease: "sine.inOut" }, 7.6);
      out("#friction", 9.22);

      // 4 · PAIN (9.45 – 12.7)
      tl.to("#painTint", { opacity: 1, duration: 0.6 }, 10.3);
      tl.to("#painTint", { opacity: 0.55, duration: 0.18, repeat: 3, yoyo: true, ease: "sine.inOut" }, 11.02); // throb on "melecit teruk"
      slam("#pedih", 11.62);
      shake(["#c04", "#pedih"], 11.84, 20);
      tl.set("#painTint", { opacity: 0 }, 12.7);
      out("#pedih", 12.62, 0.16);

      // 5 · PRODUCT (12.7 – 15.9)
      dropIn("#prodA", 13.56);
      slam("#prodB", 13.72);
      tl.fromTo("#prodB", { textShadow: "0 0 0px rgba(57,255,20,0)" }, { textShadow: "0 0 40px rgba(57,255,20,.95)", duration: 0.3, repeat: 3, yoyo: true }, 14.8);
      out("#prodA", 15.66); out("#prodB", 15.66);

      // 6 · GRIP + TOUCH (15.9 – 20.1)
      tl.set("#gripRing", { autoAlpha: 1 }, 16.44);
      tl.fromTo("#gripRing", { scale: 0.2, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.35, ease: "back.out(2)" }, 16.44);
      popIn("#gripTag", 16.86);
      tl.set("#gripLine", { autoAlpha: 1 }, 16.95);
      tl.fromTo("#gripLine", { scaleY: 0 }, { scaleY: 1, duration: 0.2, ease: "power2.out" }, 16.95);
      ["#gripRing", "#gripLine", "#gripTag"].forEach((s) => out(s, 18.1));
      popIn("#chkKesat", 19.04, { x: 120 });
      popIn("#chkTimbul", 19.68, { x: 120 });
      out("#chkKesat", 20.3); out("#chkTimbul", 20.3);

      // 7 · LESS FRICTION (20.1 – 22.62)
      dropIn("#meter", 20.5);
      tl.fromTo("#meterFill", { width: "92%", backgroundColor: "#ff2d3a" }, { width: "16%", backgroundColor: "#39ff14", duration: 0.6, ease: "power3.inOut" }, 21.08);
      out("#meter", 22.42);

      // 8 · BREATHABLE (22.62 – 25.85) → checks carry over the cut
      popIn("#breath", 22.92);
      tl.set("#air", { autoAlpha: 1 }, 23.3);
      tl.fromTo("#air .aw", { x: -60, opacity: 0 }, { x: 40, opacity: 1, duration: 0.7, stagger: 0.12, repeat: 2, ease: "sine.inOut" }, 23.3);
      out("#air", 25.1);
      popIn("#chkPanas", 25.34, { x: -120 });
      popIn("#chkKuap", 26.16, { x: -120 });
      out("#breath", 26.8);
      out("#chkPanas", 27.3); out("#chkKuap", 27.3);

      // 9–10 · CTA (25.85 – end): everything lands and holds to the last frame
      dropIn("#ctaA", 27.0);
      slam("#ctaB", 27.6);
      tl.fromTo("#ctaB", { rotation: 0 }, { rotation: -4, duration: 0.2, ease: "back.out(3)" }, 27.82);
      show("#dots", 27.66);
      tl.fromTo("#dots i", { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.3, stagger: 0.08, ease: "back.out(3)" }, 27.66);
      popIn("#btn", 28.62);
      tl.to("#btn", { scale: 1.06, duration: 0.25, repeat: 5, yoyo: true, ease: "sine.inOut" }, 29.7); // 6 legs → ends back at 1.0 (31.2)
      tl.set("#ripple", { autoAlpha: 1 }, 28.9);
      tl.fromTo("#ripple", { scaleX: 1, scaleY: 1, opacity: 1 }, { scaleX: 1.12, scaleY: 1.5, opacity: 0, duration: 0.6, repeat: 3, repeatDelay: 0.1, ease: "power2.out", immediateRender: false }, 28.9);
      slam("#soldout", 29.14);
      shake(["#c10", "#soldout"], 29.36, 12);

      // captions: one group at a time; active word yellow, keywords neon green
      capGroups.forEach((g, i) => {
        const next = capGroups[i + 1];
        const end = Math.min(g.e + 0.3, next ? next.s : DUR);
        tl.set(g.el, { autoAlpha: 1 }, g.s);
        tl.fromTo(g.el, { scale: 0.86, y: 14 }, { scale: 1, y: 0, duration: 0.12, ease: "back.out(2)" }, g.s);
        tl.set(g.el, { autoAlpha: 0 }, end);
        g.words.forEach((w, j) => {
          const off = j + 1 < g.words.length ? g.words[j + 1].s : end;
          tl.set(w.el, { color: w.kw ? "#39ff14" : "#ffe600", scale: 1.12 }, w.s);
          tl.set(w.el, { color: w.kw ? "#39ff14" : "#ffffff", scale: 1 }, off);
        });
      });

      tl.to({}, { duration: 0.001 }, DUR - 0.001); // pin the timeline length to the film
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
